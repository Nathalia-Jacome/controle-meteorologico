<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Localização & Clima</title>

  <!-- Leaflet CSS (Mapa interativo gratuito, sem API Key) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    :root {
      --bg: #0f0508;
      --bg-glow: rgba(159, 18, 57, 0.16);
      --surface: #1a090f;
      --surface-elevated: #230d15;
      --input-bg: #13060a;
      --text: #fdf2f4;
      --text-muted: #c29aa7;
      --border: #3d1824;
      --border-hover: #5c2436;
      --primary: #9f1239;
      --primary-hover: #be123c;
      --accent: #fda4af;
      --secondary: #2a1019;
      --secondary-hover: #3b1724;
      --success-bg: rgba(20, 83, 45, 0.38);
      --success-border: rgba(74, 222, 128, 0.25);
      --success-text: #86efac;
      --error-bg: rgba(136, 19, 55, 0.45);
      --error-border: rgba(251, 113, 133, 0.35);
      --error-text: #fecdd3;
      --focus-ring: rgba(225, 29, 72, 0.3);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 20% 15%, var(--bg-glow), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(120, 12, 42, 0.14), transparent 50%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 1060px;
      display: grid;
      grid-template-columns: minmax(340px, 430px) 1fr;
      gap: 1.25rem;
      align-items: stretch;
    }

    .card {
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.65);
    }

    .card-header {
      margin-bottom: 1.5rem;
    }

    .card-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #f3dce2;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      font-size: 0.94rem;
      color: var(--text);
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    input[type="text"]::placeholder {
      color: #7d5360;
    }

    input[type="text"]:hover {
      border-color: var(--border-hover);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary-hover);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.78rem 1rem;
      font-size: 0.94rem;
      font-weight: 600;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease, border-color 0.15s ease;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
      margin-bottom: 1.1rem;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--secondary-hover);
      border-color: var(--border-hover);
    }

    .btn-primary {
      background: linear-gradient(135deg, #9f1239 0%, #881337 100%);
      color: #ffffff;
      margin-top: 0.4rem;
      box-shadow: 0 6px 18px -6px rgba(159, 18, 57, 0.7);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #be123c 0%, #9f1239 100%);
    }

    .status-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 500;
      margin-top: 1rem;
      border: 1px solid transparent;
    }

    .status-banner.success {
      display: block;
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .status-banner.error {
      display: block;
      background-color: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .weather-card {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 11px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
    }

    .weather-card.visible {
      display: block;
    }

    .weather-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    .weather-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .metric-box {
      background-color: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0.75rem;
      text-align: center;
    }

    .metric-label {
      display: block;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .gps-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: -0.65rem;
      margin-bottom: 0.9rem;
      min-height: 1.1rem;
    }

    /* Painel do Mapa */
    .map-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 520px;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .map-toolbar-title {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .map-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e11d48;
      box-shadow: 0 0 8px rgba(225, 29, 72, 0.8);
    }

    .map-coords-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      color: var(--accent);
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }

    #map {
      flex: 1;
      width: 100%;
      background-color: #12060a;
      z-index: 1;
    }

    /* Sutil tonalidade vinho sobre o mapa escuro */
    .leaflet-tile-pane {
      filter: sepia(22%) hue-rotate(308deg) saturate(115%) brightness(0.92);
    }

    /* Estilização dos controles do Leaflet para o tema vinho */
    .leaflet-bar {
      border: 1px solid var(--border) !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45) !important;
    }

    .leaflet-bar a {
      background-color: var(--surface) !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .leaflet-bar a:hover {
      background-color: var(--secondary-hover) !important;
      color: var(--accent) !important;
    }

    .leaflet-control-attribution {
      background: rgba(15, 5, 8, 0.78) !important;
      color: var(--text-muted) !important;
      font-size: 0.68rem !important;
    }

    .leaflet-control-attribution a {
      color: var(--accent) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background-color: var(--surface) !important;
      color: var(--text) !important;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6) !important;
    }

    .leaflet-popup-close-button {
      color: var(--text-muted) !important;
    }

    /* Marcador customizado em vinho com pulso */
    .wine-pin {
      position: relative;
      width: 20px;
      height: 20px;
    }

    .wine-pin-core {
      position: absolute;
      inset: 3px;
      background: #e11d48;
      border: 2.5px solid #fdf2f4;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.9);
    }

    .wine-pin-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(251, 113, 133, 0.7);
      animation: pinPulse 1.8s ease-out infinite;
    }

    @keyframes pinPulse {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    .map-hint {
      padding: 0.6rem 1.25rem;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    .loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 860px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .map-card {
        min-height: 360px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 0.85rem;
      }

      .card {
        padding: 1.4rem;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <main class="app-shell">
    <!-- Painel do Formulário -->
    <section class="card">
      <header class="card-header">
        <h1>Cadastro de Coordenadas</h1>
        <p>Informe o local e capture, digite ou clique no mapa para definir as coordenadas.</p>
      </header>

      <form id="locationForm" novalidate>
        <div class="form-group">
          <label for="local">Local / Identificação</label>
          <input
            type="text"
            id="local"
            name="entry.1022794968"
            placeholder="Ex: Ponto de Coleta A"
            required
            autocomplete="off"
          />
        </div>

        <button type="button" id="btnGps" class="btn btn-secondary">
          <span class="spinner" aria-hidden="true"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
            <circle cx="12" cy="12" r="7"></circle>
          </svg>
          <span id="gpsBtnText">Capturar coordenadas via GPS</span>
        </button>
        <div id="gpsMeta" class="gps-meta" aria-live="polite"></div>

        <div class="grid-2">
          <div class="form-group">
            <label for="latitude">Latitude</label>
            <input
              type="text"
              id="latitude"
              name="entry.1278297924"
              placeholder="-23.6639"
              inputmode="decimal"
              required
            />
          </div>

          <div class="form-group">
            <label for="longitude">Longitude</label>
            <input
              type="text"
              id="longitude"
              name="entry.738929017"
              placeholder="-46.5383"
              inputmode="decimal"
              required
            />
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submitBtnText">Enviar Registro</span>
        </button>

        <div id="statusBanner" class="status-banner" role="alert" aria-live="assertive"></div>

        <section id="weatherCard" class="weather-card" aria-live="polite">
          <div id="weatherTitle" class="weather-title"></div>
          <div class="weather-metrics">
            <div class="metric-box">
              <span class="metric-label">Temperatura</span>
              <span id="weatherTemp" class="metric-value">--</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Umidade</span>
              <span id="weatherHumidity" class="metric-value">--</span>
            </div>
          </div>
        </section>
      </form>
    </section>

    <!-- Painel do Mapa -->
    <section class="map-card" aria-label="Mapa de localização">
      <div class="map-toolbar">
        <span class="map-toolbar-title">
          <span class="map-dot" aria-hidden="true"></span>
          Visualização no Mapa
        </span>
        <span id="mapCoordsPill" class="map-coords-pill">Aguardando coordenadas</span>
      </div>

      <div id="map"></div>

      <div class="map-hint">
        Dica: digite as coordenadas, use o GPS ou clique diretamente no mapa para selecionar um ponto.
      </div>
    </section>
  </main>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    (() => {
      const GOOGLE_FORM_ACTION_URL =
        "https://docs.google.com/forms/d/e/1FAIpQLSfDpuoLfmkqqEnkgmkukDU0jff1Q9PX-s6kabDsbDR0nLEL6w/formResponse";
      const OPEN_METEO_API_URL = "https://api.open-meteo.com/v1/forecast";

      const form = document.getElementById("locationForm");
      const localInput = document.getElementById("local");
      const latInput = document.getElementById("latitude");
      const lngInput = document.getElementById("longitude");
      const btnGps = document.getElementById("btnGps");
      const gpsBtnText = document.getElementById("gpsBtnText");
      const gpsMeta = document.getElementById("gpsMeta");
      const btnSubmit = document.getElementById("btnSubmit");
      const submitBtnText = document.getElementById("submitBtnText");
      const statusBanner = document.getElementById("statusBanner");
      const weatherCard = document.getElementById("weatherCard");
      const weatherTitle = document.getElementById("weatherTitle");
      const weatherTemp = document.getElementById("weatherTemp");
      const weatherHumidity = document.getElementById("weatherHumidity");
      const mapCoordsPill = document.getElementById("mapCoordsPill");

      // Inicialização do mapa (visão inicial centrada no Brasil)
      const map = L.map("map", {
        zoomControl: true,
        scrollWheelZoom: true
      }).setView([-14.235, -51.9253], 4);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 19
      }).addTo(map);

      const wineIcon = L.divIcon({
        className: "",
        html: '<div class="wine-pin"><div class="wine-pin-pulse"></div><div class="wine-pin-core"></div></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
        popupAnchor: [0, -12]
      });

      let marker = null;
      let accuracyCircle = null;
      let typingTimer = null;

      const updateMapPosition = (lat, lng, options = {}) => {
        const { zoom = 13, accuracy = null, popupHtml = null } = options;

        if (!marker) {
          marker = L.marker([lat, lng], { icon: wineIcon }).addTo(map);
        } else {
          marker.setLatLng([lat, lng]);
        }

        if (accuracyCircle) {
          map.removeLayer(accuracyCircle);
          accuracyCircle = null;
        }

        if (accuracy && accuracy > 0) {
          accuracyCircle = L.circle([lat, lng], {
            radius: accuracy,
            color: "#e11d48",
            fillColor: "#9f1239",
            fillOpacity: 0.18,
            weight: 1
          }).addTo(map);
        }

        if (popupHtml) {
          marker.bindPopup(popupHtml).openPopup();
        } else {
          marker.closePopup();
        }

        map.flyTo([lat, lng], Math.max(map.getZoom(), zoom), {
          duration: 0.9
        });

        mapCoordsPill.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      };

      const setBanner = (type, message) => {
        statusBanner.className = `status-banner ${type}`;
        statusBanner.textContent = message;
      };

      const clearBanner = () => {
        statusBanner.className = "status-banner";
        statusBanner.textContent = "";
      };

      const hideWeatherCard = () => {
        weatherCard.classList.remove("visible");
      };

      const showWeatherCard = (local, tempText, humidityText) => {
        weatherTitle.textContent = `Clima atual — ${local}`;
        weatherTemp.textContent = tempText;
        weatherHumidity.textContent = humidityText;
        weatherCard.classList.add("visible");
      };

      const isValidCoordinate = (val, min, max) => {
        const normalized = val.trim().replace(",", ".");
        if (!/^-?\d+(\.\d+)?$/.test(normalized)) return false;
        const num = Number(normalized);
        return Number.isFinite(num) && num >= min && num <= max;
      };

      // Atualiza o mapa em tempo real ao digitar coordenadas (com pequeno debounce)
      const handleCoordinateTyping = () => {
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          const latStr = latInput.value.trim().replace(",", ".");
          const lngStr = lngInput.value.trim().replace(",", ".");

          if (isValidCoordinate(latStr, -90, 90) && isValidCoordinate(lngStr, -180, 180)) {
            updateMapPosition(Number(latStr), Number(lngStr), { zoom: 12 });
          }
        }, 350);
      };

      latInput.addEventListener("input", handleCoordinateTyping);
      lngInput.addEventListener("input", handleCoordinateTyping);

      // Permite clicar diretamente no mapa para preencher os campos
      map.on("click", (e) => {
        const { lat, lng } = e.latlng;
        latInput.value = lat.toFixed(6);
        lngInput.value = lng.toFixed(6);
        gpsMeta.textContent = "Coordenadas selecionadas pelo mapa.";
        updateMapPosition(lat, lng, { zoom: map.getZoom() < 10 ? 12 : map.getZoom() });
      });

      // Captura de geolocalização do navegador
      btnGps.addEventListener("click", () => {
        clearBanner();

        if (!("geolocation" in navigator)) {
          setBanner("error", "Geolocalização não é suportada pelo seu navegador.");
          return;
        }

        btnGps.disabled = true;
        btnGps.classList.add("loading");
        gpsBtnText.textContent = "Obtendo sinal GPS...";
        gpsMeta.textContent = "";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            latInput.value = latitude.toFixed(6);
            lngInput.value = longitude.toFixed(6);
            gpsMeta.textContent = `Precisão aproximada: ±${Math.round(accuracy)} metros`;

            updateMapPosition(latitude, longitude, { zoom: 14, accuracy });

            btnGps.disabled = false;
            btnGps.classList.remove("loading");
            gpsBtnText.textContent = "Atualizar coordenadas via GPS";
          },
          (error) => {
            const messages = {
              1: "Permissão de localização negada no navegador.",
              2: "Sinal de localização indisponível no momento.",
              3: "Tempo limite esgotado ao buscar o GPS."
            };
            setBanner("error", messages[error.code] || "Erro ao obter localização.");

            btnGps.disabled = false;
            btnGps.classList.remove("loading");
            gpsBtnText.textContent = "Capturar coordenadas via GPS";
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      });

      // Submissão para o Google Forms + consulta na Open-Meteo
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearBanner();
        hideWeatherCard();

        const localValue = localInput.value.trim();
        const latValue = latInput.value.trim().replace(",", ".");
        const lngValue = lngInput.value.trim().replace(",", ".");

        if (!localValue) {
          setBanner("error", "Preencha o campo Local.");
          localInput.focus();
          return;
        }

        if (!isValidCoordinate(latValue, -90, 90)) {
          setBanner("error", "Latitude inválida. Use um valor entre -90 e 90.");
          latInput.focus();
          return;
        }

        if (!isValidCoordinate(lngValue, -180, 180)) {
          setBanner("error", "Longitude inválida. Use um valor entre -180 e 180.");
          lngInput.focus();
          return;
        }

        latInput.value = latValue;
        lngInput.value = lngValue;

        const formData = new URLSearchParams(new FormData(form));

        btnSubmit.disabled = true;
        btnSubmit.classList.add("loading");
        submitBtnText.textContent = "Enviando e consultando clima...";

        try {
          // 1. Registra no Google Forms (alimenta a planilha do Colab)
          await fetch(GOOGLE_FORM_ACTION_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData.toString()
          });

          // 2. Consulta temperatura e umidade na Open-Meteo
          const params = new URLSearchParams({
            latitude: latValue,
            longitude: lngValue,
            current: "temperature_2m,relative_humidity_2m",
            timezone: "auto"
          });

          const weatherResponse = await fetch(`${OPEN_METEO_API_URL}?${params.toString()}`);
          if (!weatherResponse.ok) {
            throw new Error("Erro ao consultar a Open-Meteo");
          }

          const weatherData = await weatherResponse.json();
          const temp = weatherData.current?.temperature_2m;
          const tempUnit = weatherData.current_units?.temperature_2m || "°C";
          const humidity = weatherData.current?.relative_humidity_2m;
          const humidityUnit = weatherData.current_units?.relative_humidity_2m || "%";

          const tempText = temp !== undefined ? `${temp}${tempUnit}` : "--";
          const humidityText = humidity !== undefined ? `${humidity}${humidityUnit}` : "--";

          setBanner("success", "Registro enviado com sucesso!");
          showWeatherCard(localValue, tempText, humidityText);

          // Atualiza o mapa com o popup do clima recém-consultado
          const safeLocal = localValue.replace(/[<>&"]/g, (ch) => ({
            "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;"
          }[ch]));

          updateMapPosition(Number(latValue), Number(lngValue), {
            zoom: 13,
            popupHtml: `<strong>${safeLocal}</strong><br/>🌡️ ${tempText} &nbsp;|&nbsp; 💧 ${humidityText}`
          });

          form.reset();
          gpsMeta.textContent = "";
        } catch (err) {
          setBanner("error", "Falha ao enviar ou consultar o clima. Verifique sua conexão e tente novamente.");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove("loading");
          submitBtnText.textContent = "Enviar Registro";
        }
      });
    })();
  </script>
</body>
</html>
